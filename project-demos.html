<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>Project Demo | Mohammed Asif</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101522;
      color: #eef2ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      background: radial-gradient(ellipse at 50% 0, #263351 0, #101522 58%);
    }

    a { color: #a9c7ff; }

    .shell { width: min(760px, 100%); margin: 0 auto; }
    .back { display: inline-block; margin-bottom: 30px; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .eyebrow { color: #a9c7ff; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 6vw, 3rem); }
    .intro { margin: 0 0 24px; color: #b6bfd2; line-height: 1.6; }
    .panel { padding: clamp(18px, 4vw, 30px); border: 1px solid #35415a; border-radius: 18px; background: #171e2d; box-shadow: 0 24px 70px #080b1280; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .primary, .secondary, .cell, .drop {
      border: 1px solid #47546e;
      border-radius: 10px;
      background: #242e42;
      cursor: pointer;
    }
    .primary, .secondary { min-height: 42px; padding: 9px 16px; }
    .primary { border-color: #86aaff; background: #456fc4; color: white; font-weight: 700; }
    .primary:hover { background: #5681d8; }
    .secondary:hover, .cell:hover, .drop:hover { border-color: #9ab8ff; background: #303e59; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #9ab8ff; outline-offset: 3px; }
    .status { min-height: 1.5em; margin: 16px 0; color: #c8d6f5; font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .clock { display: grid; justify-items: center; gap: 20px; }
    .clock-face { position: relative; width: min(300px, 75vw); aspect-ratio: 1; border: 8px solid #7183a5; border-radius: 50%; background: radial-gradient(circle, #202b40 0 4%, transparent 4.5%), #131a28; box-shadow: inset 0 0 28px #080b12, 0 12px 30px #080b1270; }
    .tick { position: absolute; top: 8%; left: 50%; width: 3px; height: 10px; border-radius: 3px; background: #bdc9df; transform-origin: 50% 1200%; }
    .hand { position: absolute; bottom: 50%; left: calc(50% - 2px); width: 4px; border-radius: 5px; background: #eaf0ff; transform-origin: 50% 100%; }
    .hand.hour { height: 25%; }
    .hand.minute { height: 35%; background: #91b2ff; }
    .hand.second { width: 2px; height: 39%; background: #ff8b79; }
    .clock-time { font-size: 1.25rem; font-variant-numeric: tabular-nums; color: #c8d6f5; }

    .board { display: grid; gap: 10px; width: min(360px, 100%); margin: 0 auto 20px; }
    .tic-board { grid-template-columns: repeat(3, 1fr); }
    .tic-cell { aspect-ratio: 1; font-size: clamp(2.5rem, 12vw, 4.5rem); font-weight: 800; }
    .tic-cell[data-mark="X"] { color: #9ab8ff; }
    .tic-cell[data-mark="O"] { color: #ffad9d; }

    .snake-wrap { display: grid; justify-items: center; gap: 14px; }
    canvas { display: block; width: min(400px, 100%); height: auto; border: 1px solid #47546e; border-radius: 12px; background: #101722; touch-action: none; }
    .direction-pad { display: grid; grid-template-columns: repeat(3, 48px); gap: 5px; }
    .direction-pad button { min-height: 42px; }
    .direction-pad button:nth-child(1) { grid-column: 2; }
    .direction-pad button:nth-child(2) { grid-column: 1; grid-row: 2; }
    .direction-pad button:nth-child(3) { grid-column: 2; grid-row: 2; }
    .direction-pad button:nth-child(4) { grid-column: 3; grid-row: 2; }

    .connect-wrap { overflow-x: auto; }
    .connect-board { display: grid; grid-template-columns: repeat(7, minmax(36px, 1fr)); gap: 7px; width: min(430px, 100%); margin: 0 auto; padding: 12px; border-radius: 14px; background: #315da8; }
    .connect-cell { aspect-ratio: 1; min-width: 0; border: 0; border-radius: 50%; background: #18243a; }
    .connect-cell[data-mark="red"] { background: #ff8175; box-shadow: inset 0 0 0 3px #ffd0c9; }
    .connect-cell[data-mark="yellow"] { background: #ffd166; box-shadow: inset 0 0 0 3px #fff0bd; }
    .drop-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; width: min(430px, 100%); margin: 0 auto 8px; }
    .drop { min-height: 38px; }

    @media (max-width: 520px) {
      body { padding: 22px 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="index.html#projects">&larr; Back to projects</a>
    <p class="eyebrow">Interactive project demo</p>
    <h1 id="title">Project Demo</h1>
    <p class="intro" id="intro"></p>
    <section class="panel" id="demo" aria-live="polite"></section>
  </main>
  <script>
    (function () {
      const demos = {
        "analog-clock": {
          title: "Analog Clock",
          intro: "A live clock demo inspired by the Python desktop clock project.",
          render: renderClock
        },
        "tic-tac-toe": {
          title: "Tic Tac Toe",
          intro: "Take turns as X and O. The first player to make a line of three wins.",
          render: renderTicTacToe
        },
        "snake-game": {
          title: "Snake Game",
          intro: "Use the arrow keys, WASD, or the buttons to collect food and grow.",
          render: renderSnake
        },
        "connect-four": {
          title: "Connect Four",
          intro: "Drop discs into a column. Connect four in a row to win.",
          render: renderConnectFour
        }
      };

      const demo = demos[new URLSearchParams(location.search).get("project")];
      if (!demo) {
        document.querySelector("#title").textContent = "Demo not found";
        document.querySelector("#intro").textContent = "Choose a project from the portfolio to open its demo.";
        document.querySelector("#demo").innerHTML = '<a href="mohammedasif-portfolio.html#projects">Return to projects</a>';
        return;
      }

      document.title = demo.title + " Demo | Mohammed Asif";
      document.querySelector("#title").textContent = demo.title;
      document.querySelector("#intro").textContent = demo.intro;
      demo.render(document.querySelector("#demo"));

      function renderClock(root) {
        root.innerHTML = '<div class="clock"><div class="clock-face" role="img" aria-label="Live analog clock"><div id="clock-hands"></div></div><div class="clock-time" id="clock-time"></div></div>';
        const hands = root.querySelector("#clock-hands");
        for (let i = 0; i < 12; i += 1) {
          const tick = document.createElement("span");
          tick.className = "tick";
          tick.style.transform = "rotate(" + (i * 30) + "deg)";
          hands.appendChild(tick);
        }
        ["hour", "minute", "second"].forEach(function (name) {
          const hand = document.createElement("span");
          hand.className = "hand " + name;
          hand.id = "hand-" + name;
          hands.appendChild(hand);
        });
        function update() {
          const now = new Date();
          const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
          const minutes = now.getMinutes() + seconds / 60;
          const hours = (now.getHours() % 12) + minutes / 60;
          root.querySelector("#hand-second").style.transform = "rotate(" + (seconds * 6) + "deg)";
          root.querySelector("#hand-minute").style.transform = "rotate(" + (minutes * 6) + "deg)";
          root.querySelector("#hand-hour").style.transform = "rotate(" + (hours * 30) + "deg)";
          root.querySelector("#clock-time").textContent = now.toLocaleTimeString();
        }
        update();
        window.setInterval(update, 250);
      }

      function renderTicTacToe(root) {
        root.innerHTML = '<p class="status" id="game-status" aria-live="polite">X starts.</p><div class="board tic-board" role="grid" aria-label="Tic Tac Toe board"></div><button class="secondary" id="reset-game" type="button">New game</button>';
        const board = root.querySelector(".tic-board");
        const status = root.querySelector("#game-status");
        const cells = Array(9).fill("");
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        let player = "X";
        let finished = false;
        cells.forEach(function (_, index) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "cell tic-cell";
          button.setAttribute("role", "gridcell");
          button.setAttribute("aria-label", "Empty square");
          button.addEventListener("click", function () {
            if (finished || cells[index]) return;
            cells[index] = player;
            button.textContent = player;
            button.dataset.mark = player;
            button.setAttribute("aria-label", player + " square");
            if (wins.some(function (line) { return line.every(function (cell) { return cells[cell] === player; }); })) {
              status.textContent = player + " wins!";
              finished = true;
            } else if (cells.every(Boolean)) {
              status.textContent = "It is a draw.";
              finished = true;
            } else {
              player = player === "X" ? "O" : "X";
              status.textContent = player + "'s turn.";
            }
          });
          board.appendChild(button);
        });
        root.querySelector("#reset-game").addEventListener("click", function () {
          cells.fill("");
          player = "X";
          finished = false;
          status.textContent = "X starts.";
          board.querySelectorAll("button").forEach(function (button) {
            button.textContent = "";
            delete button.dataset.mark;
            button.setAttribute("aria-label", "Empty square");
          });
        });
      }

      function renderSnake(root) {
        root.innerHTML = '<div class="snake-wrap"><p class="status" id="snake-status" aria-live="polite">Press Start to play.</p><canvas width="400" height="400" aria-label="Snake game board"></canvas><div class="actions"><button class="primary" id="snake-start" type="button">Start game</button><span class="status" id="snake-score">Score: 0</span></div><div class="direction-pad" aria-label="Snake direction controls"><button class="secondary" data-direction="up" type="button" aria-label="Up">&uarr;</button><button class="secondary" data-direction="left" type="button" aria-label="Left">&larr;</button><button class="secondary" data-direction="down" type="button" aria-label="Down">&darr;</button><button class="secondary" data-direction="right" type="button" aria-label="Right">&rarr;</button></div></div>';
        const canvas = root.querySelector("canvas");
        const context = canvas.getContext("2d");
        const status = root.querySelector("#snake-status");
        const scoreLabel = root.querySelector("#snake-score");
        const size = 20;
        let snake;
        let food;
        let direction;
        let nextDirection;
        let score;
        let timer = null;

        function draw() {
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.fillStyle = "#ff8175";
          context.fillRect(food.x * size + 3, food.y * size + 3, size - 6, size - 6);
          snake.forEach(function (part, index) {
            context.fillStyle = index ? "#75a0ef" : "#b4ccff";
            context.fillRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4);
          });
        }
        function finish(message) {
          window.clearInterval(timer);
          timer = null;
          status.textContent = message;
        }
        function tick() {
          direction = nextDirection;
          const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
          if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 ||
              snake.some(function (part) { return part.x === head.x && part.y === head.y; })) {
            finish("Game over. Your score: " + score + ".");
            return;
          }
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            score += 1;
            scoreLabel.textContent = "Score: " + score;
            do {
              food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20) };
            } while (snake.some(function (part) { return part.x === food.x && part.y === food.y; }));
          } else {
            snake.pop();
          }
          draw();
        }
        function changeDirection(name) {
          const directions = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
          const candidate = directions[name];
          if (candidate && direction && candidate.x !== -direction.x && candidate.y !== -direction.y) nextDirection = candidate;
        }
        function start() {
          window.clearInterval(timer);
          snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
          direction = { x: 1, y: 0 };
          nextDirection = direction;
          score = 0;
          food = { x: 15, y: 10 };
          status.textContent = "Use arrow keys or WASD.";
          scoreLabel.textContent = "Score: 0";
          draw();
          timer = window.setInterval(tick, 120);
        }
        document.addEventListener("keydown", function (event) {
          const keys = { ArrowUp: "up", w: "up", ArrowDown: "down", s: "down", ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right" };
          const name = keys[event.key];
          if (name) {
            event.preventDefault();
            changeDirection(name);
          }
        });
        root.querySelectorAll("[data-direction]").forEach(function (button) {
          button.addEventListener("click", function () { changeDirection(button.dataset.direction); });
        });
        root.querySelector("#snake-start").addEventListener("click", start);
        context.fillStyle = "#263247";
        context.fillRect(0, 0, canvas.width, canvas.height);
      }

      function renderConnectFour(root) {
        root.innerHTML = '<p class="status" id="connect-status" aria-live="polite">Red starts.</p><div class="drop-row"></div><div class="connect-wrap"><div class="connect-board" role="grid" aria-label="Connect Four board"></div></div><button class="secondary" id="connect-reset" type="button">New game</button>';
        const status = root.querySelector("#connect-status");
        const board = root.querySelector(".connect-board");
        const drops = root.querySelector(".drop-row");
        const cells = Array.from({ length: 6 }, function () { return Array(7).fill(""); });
        let player = "red";
        let finished = false;
        function hasWon(row, col) {
          return [[0,1],[1,0],[1,1],[1,-1]].some(function (direction) {
            let count = 1;
            for (const sign of [-1, 1]) {
              let r = row + direction[0] * sign;
              let c = col + direction[1] * sign;
              while (r >= 0 && r < 6 && c >= 0 && c < 7 && cells[r][c] === player) {
                count += 1;
                r += direction[0] * sign;
                c += direction[1] * sign;
              }
            }
            return count >= 4;
          });
        }
        function playColumn(col) {
          if (finished) return;
          let row = 5;
          while (row >= 0 && cells[row][col]) row -= 1;
          if (row < 0) return;
          cells[row][col] = player;
          board.querySelector('[data-cell="' + row + '-' + col + '"]').dataset.mark = player;
          if (hasWon(row, col)) {
            status.textContent = (player === "red" ? "Red" : "Yellow") + " wins!";
            finished = true;
          } else if (cells.every(function (line) { return line.every(Boolean); })) {
            status.textContent = "It is a draw.";
            finished = true;
          } else {
            player = player === "red" ? "yellow" : "red";
            status.textContent = (player === "red" ? "Red" : "Yellow") + "'s turn.";
          }
        }
        for (let col = 0; col < 7; col += 1) {
          const drop = document.createElement("button");
          drop.type = "button";
          drop.className = "drop";
          drop.textContent = "Drop";
          drop.setAttribute("aria-label", "Drop disc in column " + (col + 1));
          drop.addEventListener("click", function () { playColumn(col); });
          drops.appendChild(drop);
        }
        cells.forEach(function (line, row) {
          line.forEach(function (_, col) {
            const cell = document.createElement("div");
            cell.className = "connect-cell";
            cell.dataset.cell = row + "-" + col;
            cell.setAttribute("role", "gridcell");
            board.appendChild(cell);
          });
        });
        root.querySelector("#connect-reset").addEventListener("click", function () {
          cells.forEach(function (line) { line.fill(""); });
          board.querySelectorAll(".connect-cell").forEach(function (cell) { delete cell.dataset.mark; });
          player = "red";
          finished = false;
          status.textContent = "Red starts.";
        });
      }

    }());
  </script>
</body>
</html>
